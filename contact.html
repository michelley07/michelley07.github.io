<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>✉️ Contact Me</h1>
        <nav>
            <a href="index.html">🏠 Home</a>
            <a href="outdoor.html">🌳 Outdoor</a>
            <a href="indoor.html">🛋️ Indoor</a>
            <a href="about.html">👋 About Me</a>
            <a href="contact.html">✉️ Contact</a>
        </nav>
    </header>

    <main>
        <h2>Share Your Favourite Hobby!</h2>
        <p style="margin-bottom: 10px;">Tell me what you like to do in your free time:</p>

        <form>
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Your Message:</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message here..."></textarea>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 My Hobby Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
